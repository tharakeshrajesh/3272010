<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calendar</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .calendar {
    width: 75%;
    background-color: #fff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    }
    .calendar-header button {
    background-color: transparent;
    border: none;
    font-size: 1.5em;
    cursor: pointer;
    }
    #month-year {
    font-size: 1.2em;
    font-weight: bold;
    }
    .calendar-weekdays, .calendar-dates {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    }
    .calendar-weekdays div, .calendar-dates div {
    text-align: center;
    padding: 10px;
    }
    .calendar-weekdays {
    background-color: #eaeef3;
    }
    .calendar-weekdays div {
    font-weight: bold;
    }
    .calendar-dates div {
    border-bottom: 1px solid #eaeef3;
    cursor: pointer;
    }
    .calendar-dates div:hover {
    background-color: #f1f1f1;
    }
    </style>
</head>
<body>
  <div class="calendar">
    <div class="calendar-header">
      <button id="prev-month">‹</button>
      <div id="month-year"></div>
      <button id="next-month">›</button>
    </div>
    <div class="calendar-body">
      <div class="calendar-weekdays">
        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
        </div>
      <div class="calendar-dates">
        <!-- also yes, i just stole the calendar from https://dev.to/wizdomtek/creating-a-dynamic-calendar-using-html-css-and-javascript-29m so there is credits.-->
      </div>
    </div>
  </div>

  <script>
    const calendarDates = document.querySelector('.calendar-dates');
    const monthYear = document.getElementById('month-year');
    const prevMonthBtn = document.getElementById('prev-month');
    const nextMonthBtn = document.getElementById('next-month');

    let currentDate = new Date();
    let currentMonth = currentDate.getMonth();
    let currentYear = currentDate.getFullYear();

    const months = [
    'January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'
    ];

    function renderCalendar(month, year) {
        calendarDates.innerHTML = '';
        monthYear.textContent = `${months[month]} ${year}`;

        const firstDay = new Date(year, month, 1).getDay();

        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const json = '{"2026-3-25": "trash"}'
        const ratings = JSON.parse(json);

        for (let i = 0; i < firstDay; i++) {
            const blank = document.createElement('div');
            calendarDates.appendChild(blank);
        }

        for (let i = 1; i <= daysInMonth; i++) {
            const day = document.createElement('div');
            day.textContent = i;
            if (ratings[year +"-"+ (month + 1) +"-"+ i]) {
                day.className = ratings[year +"-"+ (month + 1) +"-"+ i] + " day";
            } else {
                day.className = "unrated day";
            }
            calendarDates.appendChild(day);
        }
    }

    prevMonthBtn.addEventListener('click', () => {
        currentMonth--;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }
        renderCalendar(currentMonth, currentYear);
    });

    nextMonthBtn.addEventListener('click', () => {
        currentMonth++;
        if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        renderCalendar(currentMonth, currentYear);
    });

    calendarDates.addEventListener('click', (e) => {
        if (e.target.textContent !== '') {
            alert(`You clicked on ${e.target.textContent} ${months[currentMonth]} ${currentYear}`);
        }
    });

    renderCalendar(currentMonth, currentYear);
  </script>
</body>
</html>
