<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>March 25, 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
        font-family: "Georgia", serif;
        background: #0f1115;
        color: #e4e4e4;
        margin: 0;
        padding: 20px;
        }
        
        .container {
        max-width: 900px;
        margin: auto;
        }
        
        .entry {
        background: #1a1d24;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        min-height: auto;
        }
        
        .entry h1 {
        margin-bottom: 10px;
        font-size: 2rem;
        }
        
        .content {
        font-size: 1.1rem;
        line-height: 1.8;
        color: #d0d0d0;
        }
        
        a.back {
        display: inline-block;
        margin-bottom: 20px;
        color: #aaa;
        text-decoration: none;
        }
        
        a.back:hover {
        color: #fff;
        }
    </style>
</head>

<body>

    <div class="container">
        <a href="/journal" class="back">← Back to Calendar</a>

        <div class="entry">
            <h1>March 25, 2026</h1>

            <div class="content">
                <p>
                    I woke up.<br>
                    I brushed my teeth.<br>
                    I watched TV.<br>
                    I did homework.<br>
                    I watched TV.<br>
                    I went outside to touch grass.<br>
                    I came home.<br>
                    I watched TV.<br>
                    I ate lunch... while watching TV.<br>
                    I brushed.<br>
                    I slept.
                </p>
            </div>
        </div>
    </div>

</body>

</html>
